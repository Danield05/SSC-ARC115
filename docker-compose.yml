# Base de datos local (perfil de desarrollo). Uso: docker compose up -d
# Los datos persisten en el volumen "dynamodb-data": sobreviven a `docker compose down`
# y a reiniciar la PC. Para empezar de cero: docker compose down -v
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    user: root
    ports:
      - "8001:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
