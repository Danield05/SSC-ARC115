name: CI

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - development

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  # ───────────── Backend ─────────────
  backend-build:
    name: Backend · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Verificar que la aplicación importa
        run: python -c "import app.main"

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Validar plantilla SAM
        run: sam validate --lint --region us-east-1

  backend-test:
    name: Backend · Test
    needs: backend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: pytest

  backend-quality:
    name: Backend · Quality
    needs: backend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt pip-audit

      - name: Lint y seguridad del código (ruff, reglas bandit)
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt

  # ───────────── Frontend ─────────────
  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  frontend-quality:
    name: Frontend · Quality
    needs: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vulnerabilidades en dependencias (npm audit)
        run: npm audit --audit-level=high

  # ───────────── Firmware ─────────────
  firmware-build:
    name: Firmware · Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # secrets.h no se sube al repositorio: para compilar se usa el de ejemplo.
      - name: Crear secrets.h de ejemplo
        run: cp firmware/gp03_monitor/secrets.example.h firmware/gp03_monitor/secrets.h

      - name: Compilar los sketches (ESP32 Dev Module)
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              version: 3.3.12
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          sketch-paths: |
            - firmware/gp03_monitor
            - firmware/pruebas/i2c_scanner
            - firmware/pruebas/hx711_calibracion
            - firmware/pruebas/max30102_prueba
            - firmware/pruebas/mlx90614_prueba
            - firmware/pruebas/oled_prueba
            - firmware/pruebas/littlefs_prueba
          libraries: |
            - name: ArduinoJson
              version: 7.4.3
            - name: HX711
              version: 0.6.6
            - name: SparkFun MAX3010x Pulse and Proximity Sensor Library
              version: 1.1.2
            - name: Adafruit MLX90614 Library
              version: 2.1.7
            - name: Adafruit SSD1306
              version: 2.5.17
            - name: Adafruit GFX Library
              version: 1.13.0
            - name: Adafruit BusIO
              version: 1.17.4
