name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  STACK_NAME: ssc-arc115
  # La región no es secreta. Como secreto, GitHub ocultaría "us-east-1" dentro de la URL de la API
  # y descartaría la salida entre trabajos (el frontend se compilaba con VITE_API_URL vacía).
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  backend:
    name: Backend · SAM deploy
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.api.outputs.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v3

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        working-directory: backend
        run: sam build

      - name: Deploy
        working-directory: backend
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --s3-prefix "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "GmailUser=$GMAIL_USER" \
              "GmailAppPassword=$GMAIL_APP_PASSWORD" \
              "JwtSecret=$JWT_SECRET" \
              "AllowedOrigin=$ALLOWED_ORIGIN"

      - name: URL de la API
        id: api
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "api_url=$url" >> "$GITHUB_OUTPUT"

      - name: Prueba de humo (/health)
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "${{ steps.api.outputs.api_url }}/health"

  frontend:
    name: Frontend · GitHub Pages
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.backend.outputs.api_url }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL llegó vacía: el frontend no sabría a qué API llamar." >&2
            exit 1
          fi
          npm run build
          cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
